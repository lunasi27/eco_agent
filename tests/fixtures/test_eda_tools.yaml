common_env:
  PDK_DIR: "/test/pdk"
  EDA_LICENSE: "/test/licenses"

steps:
  _test_echo:
    script: "tests/fixtures/scripts/_test_echo.csh"
    env:
      TEST_VAR: "hello_world"
    timeout_s: 5

  _test_sleep:
    script: "tests/fixtures/scripts/_test_sleep.csh"
    env: {}
    timeout_s: 1

  _test_fail:
    script: "tests/fixtures/scripts/_test_fail.csh"
    env: {}
    timeout_s: 5

  run_sta:
    script: "scripts/eda/run_sta.csh"
    env:
      PRIMETIME_BIN: "/opt/pt/bin/pt"
    timeout_s: 5
    parse_patterns:
      setup_vio: "Setup Violations:\\s*(\\d+)"
      hold_vio:  "Hold Violations:\\s*(\\d+)"

  run_pv:
    script: "scripts/eda/run_pv.csh"
    env: {}
    timeout_s: 5
    parse_patterns:
      pv_pass: "LVS check.*PASSED"
