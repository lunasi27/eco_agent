# config/run_context.yaml
# 运行级配置 — 每次 ECO 迭代都改
#
# 只放「随迭代变」的东西：本轮 design 身份 + 输入输出文件。
# timeout、step_command、目录等随项目走的配置全部在 project.yaml。
#
# 占位符变量规则（Python 侧 resolve，resolve 顺序：
#   先算 design_name → 再 resolve project.yaml（step_command 可用 {design_name}）
#   → 最后 resolve 本文件）：
#   - {project_name}    project.yaml 的 project_name
#   - {work_dir}        project.yaml 的 work_dir
#   - {base.xxx}        project.yaml.base 字典里的值
#   - {design_name}     本文件 design_name 字段

# ── Design 身份 ──
# 默认等于 project_name，sub-design 时覆盖
design_name: "{project_name}"

# ── 本轮迭代的执行目录 ──
# wrapper 会 cd 到这里执行命令
execution_dir: "{base.run_eco_route}"

# ── 本轮 ECO 迭代的输入/输出文件 ──
# 目录引用 project.yaml.base，只有文件名每次迭代变
preco_db:      "{base.run_eco_route}/DB/{design_name}_fixhold.enc"
preco_db_next: "{base.run_eco_route}/DB/{design_name}_fixhold_fixsetup.enc"
eco_scripts:   "{base.run_pt_fix}/output/setup.tcl"
