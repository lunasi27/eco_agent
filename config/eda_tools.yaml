# config/eda_tools.yaml
# Step 注册表 + 默认 timeout + 日志解析规则
# 几乎不改（cshell 脚本路径变了才改）
#
# ⚠️ 不再负责：工具 binary、PDK、license、step env（IT + PDS 托底）
# ⚠️ 不再负责：step_command（移到 project.yaml，项目级配置）
#
# 每个 step 最多 3 个字段：
#   timeout_s        默认超时（run_context.yaml 可覆盖）
#   parse_patterns    日志解析正则（PDS 不统计 violations，需要我们自己 parse）

steps:
  run_eco_route:
    timeout_s: 3600

  run_ext:
    timeout_s: 3600

  run_sta:
    timeout_s: 1800
    parse_patterns:
      setup_vio: "Setup Violations:\\s*(\\d+)"
      hold_vio:  "Hold Violations:\\s*(\\d+)"

  run_pv:
    timeout_s: 3600
    parse_patterns:
      pv_pass: "LVS check.*PASSED"

  run_signoff:
    timeout_s: 3600
    parse_patterns:
      signoff_pass: "Signoff DRC.*PASSED"

  run_pt_fix_setup:
    timeout_s: 1800
    parse_patterns:
      setup_vio: "Setup Violations After Fix:\\s*(\\d+)"

  run_pt_fix_hold:
    timeout_s: 1800
    parse_patterns:
      hold_vio: "Hold Violations After Fix:\\s*(\\d+)"

  run_pt_fix_leakage:
    timeout_s: 1800

  run_pt_fix_drv:
    timeout_s: 1800

  run_xtop_fix_hold:
    timeout_s: 1800
    parse_patterns:
      hold_vio: "Hold Violations After Fix:\\s*(\\d+)"
